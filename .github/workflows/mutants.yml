name: Mutation Testing

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  pull_request:
    branches: [ main ]

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-mutants
      uses: taiki-e/install-action@cargo-mutants
    - name: Generate PR diff
      if: github.event_name == 'pull_request'
      run: git diff origin/${{ github.base_ref }} > pr.diff
    - name: Run mutants on changed lines
      if: github.event_name == 'pull_request'
      run: cargo mutants --package molecular-formulas --no-shuffle -vV --in-diff pr.diff
    - name: Run full mutants sweep
      if: github.event_name != 'pull_request'
      run: cargo mutants --package molecular-formulas --no-shuffle -vV
    - name: Upload mutants report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutants-out
        path: mutants.out
