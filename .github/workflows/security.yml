name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays to catch newly disclosed advisories
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny
    - name: Run cargo-deny
      run: cargo deny check
