name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays to catch newly disclosed advisories
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny
    - name: Run cargo-deny
      run: cargo deny check
