name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Run default tests
      run: cargo test
    - name: Run all-feature tests
      run: cargo test --all-features

  feature-powerset:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack
    - name: Check every feature combination
      run: cargo hack check --feature-powerset --no-dev-deps

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-machete
      uses: taiki-e/install-action@cargo-machete
    - name: Check for unused dependencies
      run: cargo machete

  semver:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check public API against the published release
      uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.92 (MSRV)
      uses: dtolnay/rust-toolchain@1.92.0
    - name: Check on MSRV
      run: cargo check --all-features
    - name: Check mem_size feature on MSRV
      run: cargo check --no-default-features --features mem_size
    - name: Check mem_dbg feature on MSRV
      run: cargo check --no-default-features --features mem_dbg

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run clippy
      run: cargo clippy --all-features --all-targets -- -D warnings
    - name: Run clippy with mem_size
      run: cargo clippy --no-default-features --features mem_size -- -D warnings
    - name: Run clippy with mem_dbg
      run: cargo clippy --no-default-features --features mem_dbg -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check documentation
      run: cargo doc --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview, rustfmt
    - name: Install tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
    - name: Generate coverage
      run: cargo tarpaulin --all-features --engine=llvm --out xml --workspace --run-types AllTargets --run-types Doctests --exclude molecular_formulas_fuzz --exclude-files "fuzz/*"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
