[package]
name = "molecular-formulas-sqlite"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "SQLite validation for molecular formula text"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
loadable-extension = ["libsqlite3-sys/loadable_extension"]

[dependencies]
libsqlite3-sys = "0.38.2"
molecular-formulas = { path = "../../", default-features = false }

[dev-dependencies]
diesel = { version = "2.4.0", default-features = false, features = ["sqlite"] }

[workspace]
