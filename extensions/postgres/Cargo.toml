[package]
name = "molecular_formulas"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg15"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg19 = ["pgrx/pg19"]

[dependencies]
formula-parser = { package = "molecular-formulas", path = "../../", default-features = false }
pgrx = "=0.20.1"
pgrx_validation_derive = { git = "https://github.com/connetto-rs/pgrx-validation", branch = "main", features = ["pgrx"] }
